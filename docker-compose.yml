services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
    # La base de datos NO se publica al exterior: solo la ve la app por la red interna.
    # Para inspeccionarla con MongoDB Compass, descomenta:
    # ports:
    #   - "27017:27017"

  app:
    build: .
    restart: unless-stopped
    depends_on:
      mongo:
        condition: service_healthy
    ports:
      - "${PORT:-3000}:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGO_URI: mongodb://mongo:27017/leoveo
      SESSION_SECRET: ${SESSION_SECRET:?Define SESSION_SECRET en el fichero .env}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}

volumes:
  mongo-data:
